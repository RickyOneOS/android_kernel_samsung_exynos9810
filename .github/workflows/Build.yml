name: Build Kernel - star2lte (Exynos 9810)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-20.04

    steps:
    - name: Checkout kernel source
      uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          bc bison flex libssl-dev \
          build-essential curl git \
          python3 zip unzip \
          libncurses-dev

    # Clang AOSP / LineageOS
    - name: Clone Clang toolchain
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_clang_host_linux-x86 \
          clang

    # GCC 4.9 (necessario per Exynos)
    - name: Clone GCC 4.9
      run: |
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64 \
          gcc64
        git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_arm \
          gcc32

    - name: Setup environment
      run: |
        echo "ARCH=arm64" >> $GITHUB_ENV
        echo "SUBARCH=arm64" >> $GITHUB_ENV
        echo "PATH=$PWD/clang/bin:$PWD/gcc64/bin:$PWD/gcc32/bin:$PATH" >> $GITHUB_ENV

    - name: Build kernel
      run: |
        export CC=clang
        export LD=ld.lld
        export CLANG_TRIPLE=aarch64-linux-gnu-
        export CROSS_COMPILE=aarch64-linux-android-
        export CROSS_COMPILE_ARM32=arm-linux-androideabi-

        make O=out star2lte_defconfig
        make O=out -j$(nproc)

    - name: Upload kernel
      uses: actions/upload-artifact@v4
      with:
        name: star2lte-kernel
        path: out/arch/arm64/boot/